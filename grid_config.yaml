# grid_config.yaml ─────────────────────────────────────────
data_dir: "./Data"
out_dir: "./Results/grid_search/v3"
scalers_fname: "scalers.pkl"

# ─────────── 공통 학습 설정 ───────────
window: 1
save_scalers: true
epochs: 50          # 그리드 서치용 짧은 학습
patience: 15
warmup: 25
beta_x: 0.0
beta_init: 0.1
alpha: 0.5
att_hidden: 64
depth_edge: 2
log_every: 5

# ─────────── 그리드 서치 활성화 ───────
grid_search: true

# ─────────── 그리드 축(최대 256 조합) ─
batch_size_candidates:   [32]
lr_candidates:           [5e-6,5e-5, 1e-5]
weight_decay_candidates: [1e-5, 1e-4]
hidden_candidates:       [512]
k_candidates:            [3, 5]
dropout_candidates:      [0.15, 0.3]
lambda_grid_candidates:  [0.0, 0.01, 0.1]     #  ← 이름 변경
seeds: [95]

# ─────────── 단일 실행 기본값 (grid 무시) ─
batch_size: 64
lr: 5e-5
weight_decay: 5e-5
hidden: 512
k: 5
dropout: 0.3
lambda_max: 0.5
scale_targets: false